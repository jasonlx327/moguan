name: China policy official-source probe

on:
  workflow_dispatch:
  schedule:
    # 07:35 Asia/Shanghai. The script computes the date in Asia/Shanghai.
    - cron: "35 23 * * *"

permissions:
  contents: read

concurrency:
  group: cn-policy-official-probe
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Query official China government policy index
        run: node scripts/run-cn-policy-remote.mjs --output artifacts/cn-policy-current.json

      - name: Upload auditable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-policy-official-probe-${{ github.run_id }}
          path: |
            artifacts/cn-policy-current.json
            artifacts/cn-policy-current.json.sha256
          if-no-files-found: error
          retention-days: 14
